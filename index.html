<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for bubol 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Quicksand:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Quicksand', sans-serif;
  color:white;
  text-align:center;
  overflow-x:hidden;
  background:black;
}

.heart{
  position:fixed;
  top:-10px;
  color:#ff4d6d;
  font-size:18px;
  animation:fall linear infinite;
  opacity:0.7;
  z-index:0;
}
@keyframes fall{to{transform:translateY(110vh);}}

#intro{
  background:#222;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
}

#letter{
  width:320px;
  height:420px;
  background:url('surat.png') center/cover no-repeat;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
  cursor:pointer;
  transition:all 0.6s ease;
}

#letter.opening{
  opacity:0;
  transform:scale(1.1);
}

.open-text{
  margin-top:20px;
  font-family:'Dancing Script', cursive;
  font-size:24px;
  opacity:0.9;
}

#main{
  display:none;
  position:relative;
  width:100%;
  min-height:100vh;
  background:url('paper.jpg') center/cover no-repeat;
}

.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  z-index:-2;
}

.section{padding:30px 15px;}

.type{
  font-size:18px;
  white-space:pre-line;
  line-height:1.8;
  min-height:120px;
  font-family:'Playfair Display', serif;
}

.photos img{
  width:90%;
  max-width:320px;
  margin:15px auto;
  display:block;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.7);
}

.spotify-box{
  margin:25px auto;
  width:95%;
  max-width:350px;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.7);
}
</style>
</head>
<body>

<div class="overlay"></div>

<div id="intro">
  <div id="letter" onclick="openLetter()"></div>
  <p class="open-text">klik surat untuk membuka 🤍</p>
</div>

<div id="main">

  <div id="section1" class="section">
    <div id="text1" class="type"></div>
  </div>

  <div id="section2" class="section" style="display:none">
    <div class="photos">
      <img src="foto1.jpg">
      <img src="foto2.jpg">
      <img src="foto3.jpg">
      <img src="foto4.jpg">
      <img src="foto5.jpg">
    </div>
  </div>

  <!-- SPOTIFY SECTION -->
  <div id="section3" class="section" style="display:none">
    <p>lagu untuk bubol 🤍</p>
    <div class="spotify-box">
      <iframe style="border-radius:12px"
      src="https://open.spotify.com/embed/track/0NWPZLOs1JHNRMoYK5Vyos"
      width="100%" height="152" frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>
    </div>
  </div>

  <div id="section4" class="section">
    <div id="text2" class="type"></div>
  </div>

</div>

<script>
for(let i=0;i<15;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=5+Math.random()*8+"s";
  h.style.fontSize=12+Math.random()*18+"px";
  document.body.appendChild(h);
}

function typeText(el,text,speed=30, callback){
  let i=0;
  function typing(){
    if(i<text.length){
      el.innerHTML+=text[i];
      i++;
      setTimeout(typing,speed);
    } else if(callback){
      callback();
    }
  }
  typing();
}

function openLetter(){
  let letter=document.getElementById("letter");
  letter.classList.add("opening");

  setTimeout(()=>{
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";

    let t1=`open letter for bubol

aku mencintaimu melebihi musik yang selama ini jadi bahasa jiwaku.
melebihi lirik-lirik yang biasanya mengerti perasaanku,
melebihi semua kata yang pernah aku tulis ketika aku tidak tahu
bagaimana menjelaskan rasa di dadaku.

setiap rasa di hatiku seperti mengalun menjadi lagu,
dan setiap nada yang terlintas di pikiranku
selalu berujung pada satu nama yang sama — kamu.

kamu adalah lagu yang tidak pernah ingin aku hentikan,
lagu yang ingin aku dengar setiap hari,
dan lagu yang selalu membuat aku merasa pulang.`;

    let t2=`happy valentine, sayangg 🤍

makasih udah hadir di hidup aku.
makasih udah sabar sama sifat aku,
sama ego aku, sama overthinking aku,
dan sama versi aku yang kadang sulit dimengerti.

aku mungkin bukan orang paling sempurna,
tapi aku janji akan terus belajar jadi orang
yang layak untuk kamu cintai.

selama kamu mau di samping aku,
aku mau berjuang.
selama kamu masih genggam tangan aku,
aku ga akan lepas.

aku sayang kamu,
lebih dari yang bisa aku tulis di sini,
dan mungkin, selamanya.`;

    typeText(text1,t1,28, ()=>{
      document.getElementById("section2").style.display="block";
      document.getElementById("section3").style.display="block";
      typeText(text2,t2,28);
    });

  },600);
}
</script>

</body>
</html>
